<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Variables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2332;
      --muted: #6b7785;
      --line: #e3e8ee;
      --type: #d62828;
      --name: #1d4ed8;
      --comment: #8a939e;
      --ok: #0f7b4c;
      --ok-bg: #e8f7ef;
      --bad: #b42318;
      --bad-bg: #fef3f2;
      --accent: #0e7490;
      --soft: #f3fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: #f7f8fa;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tabs button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font: 600 0.85rem "DM Sans", sans-serif;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      min-height: 480px;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      min-height: 440px;
    }

    .scenario {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    pre.code {
      margin: 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(0.95rem, 1.6vw, 1.1rem);
      line-height: 1.9;
      white-space: pre-wrap;
    }

    .t { color: var(--type); font-weight: 600; }
    .n { color: var(--name); font-weight: 600; }
    .c { color: var(--comment); }
    .k { color: #7c3aed; font-weight: 600; }
    .s { color: #b45309; }

    .quiz {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 16px;
    }

    .q-text {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      text-align: left;
      border: 1.5px solid var(--line);
      background: #fbfcfd;
      border-radius: 12px;
      padding: 13px 14px;
      font: 500 1rem "DM Sans", sans-serif;
      color: var(--ink);
      cursor: pointer;
    }

    .option:hover:not(:disabled) {
      border-color: #9bb8c4;
      background: var(--soft);
    }

    .option.correct {
      border-color: #3fa575;
      background: var(--ok-bg);
      color: var(--ok);
    }

    .option.wrong {
      border-color: #f0a8a0;
      background: var(--bad-bg);
      color: var(--bad);
    }

    .option:disabled { cursor: default; }

    .feedback {
      min-height: 1.4em;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--muted);
    }

    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }

    .actions {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font: 700 0.95rem "DM Sans", sans-serif;
      cursor: pointer;
      background: #eef2f6;
      color: var(--ink);
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      margin-left: auto;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="tabs" id="tabs"></nav>
    <div class="layout">
      <section class="panel">
        <p class="scenario" id="scenario"></p>
        <pre class="code" id="code"></pre>
      </section>
      <section class="panel">
        <div class="quiz">
          <p class="q-text" id="question"></p>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
          <div class="actions">
            <button class="btn" id="prev" type="button">Back</button>
            <button class="btn primary" id="next" type="button" disabled>Next</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const examples = [
      {
        title: "Theme park",
        scenario: "A theme park only lets people on a ride if they are tall enough and old enough.",
        code: [
          '<span class="t">int</span>     <span class="n">age</span> = 13;',
          '<span class="t">float</span>   <span class="n">height</span> = 156.4;',
          '<span class="t">bool</span>    <span class="n">ridepass</span> = false;',
          '<span class="c">// allow ride if tall enough AND old enough</span>',
          '<span class="k">if</span> (<span class="n">height</span> &gt;= 140 <span class="k">and</span> <span class="n">age</span> &gt;= 13)',
          '{',
          '    <span class="n">ridepass</span> = true;',
          '}'
        ],
        questions: [
          {
            text: "The red text (int, float, bool) is…",
            options: [
              { label: "The type of data stored", correct: true },
              { label: "The name of the variable", correct: false },
              { label: "A comment for humans", correct: false }
            ],
            explain: "Types tell the computer what kind of value to expect."
          },
          {
            text: "The blue text (age, height, ridepass) is…",
            options: [
              { label: "A maths operator", correct: false },
              { label: "The variable’s name", correct: true },
              { label: "The final answer", correct: false }
            ],
            explain: "Names are labels so we can store and reuse values."
          },
          {
            text: "What does = do?",
            options: [
              { label: "Checks if two things are equal", correct: false },
              { label: "Stores a value in a variable", correct: true },
              { label: "Deletes a variable", correct: false }
            ],
            explain: "= means assignment — put this value into the variable."
          }
        ]
      },
      {
        title: "Grade",
        scenario: "Sam’s test grade is stored as a single letter.",
        code: [
          '<span class="t">char</span>    <span class="n">grade</span> = <span class="s">\'B\'</span>;',
          '<span class="t">int</span>     <span class="n">score</span> = 72;'
        ],
        questions: [
          {
            text: "What type is grade?",
            options: [
              { label: "int", correct: false },
              { label: "char", correct: true },
              { label: "bool", correct: false }
            ],
            explain: "char stores one character, like a letter."
          },
          {
            text: "What is stored in grade?",
            options: [
              { label: "The word \"grade\"", correct: false },
              { label: "The letter B", correct: true },
              { label: "The number 72", correct: false }
            ],
            explain: "Single quotes hold one character: 'B'."
          },
          {
            text: "Why not store grade as an int?",
            options: [
              { label: "Letters need char, not a whole number", correct: true },
              { label: "int cannot store 72", correct: false },
              { label: "char is only for true/false", correct: false }
            ],
            explain: "Use char for a single letter or symbol."
          }
        ]
      },
      {
        title: "Drinking age",
        scenario: "In the USA you must be 21 or older to buy alcohol. Mr Chan is 24.",
        code: [
          '<span class="t">int</span>     <span class="n">age</span> = 24;',
          '<span class="t">int</span>     <span class="n">limit</span> = 21;',
          '<span class="t">bool</span>    <span class="n">allowed</span> = false;',
          '<span class="c">// Mr Chan wants to buy a drink in the US</span>',
          '<span class="k">if</span> (<span class="n">age</span> &gt;= <span class="n">limit</span>)',
          '{',
          '    <span class="n">allowed</span> = true;',
          '}'
        ],
        questions: [
          {
            text: "How many int variables are created?",
            options: [
              { label: "1", correct: false },
              { label: "2", correct: true },
              { label: "3", correct: false }
            ],
            explain: "age and limit are ints. allowed is a bool."
          },
          {
            text: "Is Mr Chan allowed to drink in the US?",
            options: [
              { label: "No", correct: false },
              { label: "Yes — 24 ≥ 21", correct: true },
              { label: "The code never checks", correct: false }
            ],
            explain: "allowed is set to true."
          },
          {
            text: "If age was 18, what would allowed be?",
            options: [
              { label: "true", correct: false },
              { label: "false", correct: true },
              { label: "21", correct: false }
            ],
            explain: "18 is not ≥ 21, so the if is skipped."
          }
        ]
      },
      {
        title: "Key press",
        scenario: "A game waits for the player to press Y to start.",
        code: [
          '<span class="t">char</span>    <span class="n">key</span> = <span class="s">\'Y\'</span>;',
          '<span class="t">bool</span>    <span class="n">start</span> = false;',
          '<span class="c">// start only if Y is pressed</span>',
          '<span class="k">if</span> (<span class="n">key</span> == <span class="s">\'Y\'</span>)',
          '{',
          '    <span class="n">start</span> = true;',
          '}'
        ],
        questions: [
          {
            text: "What does key store?",
            options: [
              { label: "A whole sentence", correct: false },
              { label: "One character: Y", correct: true },
              { label: "true or false", correct: false }
            ],
            explain: "char holds a single key character."
          },
          {
            text: "After this runs, what is start?",
            options: [
              { label: "false", correct: false },
              { label: "true", correct: true },
              { label: "\'Y\'", correct: false }
            ],
            explain: "key equals 'Y', so start becomes true."
          },
          {
            text: "If key was 'N', what is start?",
            options: [
              { label: "true", correct: false },
              { label: "false", correct: true },
              { label: "\'N\'", correct: false }
            ],
            explain: "'N' is not 'Y', so the if is skipped."
          }
        ]
      },
      {
        title: "LED",
        scenario: "An Arduino turns an LED on pin 13 on or off.",
        code: [
          '<span class="t">int</span>     <span class="n">ledPin</span> = 13;',
          '<span class="t">bool</span>    <span class="n">ledOn</span> = false;',
          '<span class="c">// turn the LED on</span>',
          '<span class="n">ledOn</span> = true;'
        ],
        questions: [
          {
            text: "What does ledPin store?",
            options: [
              { label: "Whether the LED is bright", correct: false },
              { label: "Which pin the LED is plugged into", correct: true },
              { label: "How many LEDs there are", correct: false }
            ],
            explain: "Pin numbers are whole numbers, stored as int."
          },
          {
            text: "After this runs, what is ledOn?",
            options: [
              { label: "false", correct: false },
              { label: "true", correct: true },
              { label: "13", correct: false }
            ],
            explain: "ledOn starts false, then is set to true."
          },
          {
            text: "Best type for ledOn?",
            options: [
              { label: "char", correct: false },
              { label: "float", correct: false },
              { label: "bool", correct: true }
            ],
            explain: "On or off is a true/false idea."
          }
        ]
      },
      {
        title: "Serial cmd",
        scenario: "An Arduino reads one letter command from Serial: F = forward.",
        code: [
          '<span class="t">char</span>    <span class="n">cmd</span> = <span class="s">\'F\'</span>;',
          '<span class="t">bool</span>    <span class="n">moving</span> = false;',
          '<span class="c">// F means drive forward</span>',
          '<span class="k">if</span> (<span class="n">cmd</span> == <span class="s">\'F\'</span>)',
          '{',
          '    <span class="n">moving</span> = true;',
          '}'
        ],
        questions: [
          {
            text: "Best type for a one-letter command?",
            options: [
              { label: "int", correct: false },
              { label: "char", correct: true },
              { label: "float", correct: false }
            ],
            explain: "One letter fits char."
          },
          {
            text: "Does the robot start moving?",
            options: [
              { label: "No", correct: false },
              { label: "Yes — cmd is 'F'", correct: true },
              { label: "Only if cmd is a number", correct: false }
            ],
            explain: "The if matches 'F' and sets moving to true."
          },
          {
            text: "If cmd becomes 'S' (stop), what is moving?",
            options: [
              { label: "true", correct: false },
              { label: "false", correct: true },
              { label: "\'S\'", correct: false }
            ],
            explain: "'S' is not 'F', so moving stays false."
          }
        ]
      },
      {
        title: "Temp sensor",
        scenario: "An Arduino temperature sensor turns a fan on when it gets too hot.",
        code: [
          '<span class="t">float</span>   <span class="n">temp</span> = 31.5;',
          '<span class="t">float</span>   <span class="n">limit</span> = 28.0;',
          '<span class="t">bool</span>    <span class="n">fanOn</span> = false;',
          '<span class="c">// turn fan on if too hot</span>',
          '<span class="k">if</span> (<span class="n">temp</span> &gt; <span class="n">limit</span>)',
          '{',
          '    <span class="n">fanOn</span> = true;',
          '}'
        ],
        questions: [
          {
            text: "Why are temp and limit floats?",
            options: [
              { label: "Temperatures often have decimals", correct: true },
              { label: "Sensors cannot use int", correct: false },
              { label: "Float means on or off", correct: false }
            ],
            explain: "31.5°C needs a float."
          },
          {
            text: "Does the fan turn on?",
            options: [
              { label: "No — 31.5 is fine", correct: false },
              { label: "Yes — 31.5 &gt; 28.0", correct: true },
              { label: "No — fanOn starts false and never changes", correct: false }
            ],
            explain: "The if runs and sets fanOn to true."
          },
          {
            text: "If temp becomes 22.0, what should fanOn be?",
            options: [
              { label: "true", correct: false },
              { label: "false", correct: true },
              { label: "22.0", correct: false }
            ],
            explain: "22.0 is not greater than 28.0."
          }
        ]
      },
      {
        title: "Traffic light",
        scenario: "A model traffic light stores its colour as one letter: R, Y, or G.",
        code: [
          '<span class="t">char</span>    <span class="n">light</span> = <span class="s">\'R\'</span>;',
          '<span class="t">bool</span>    <span class="n">canGo</span> = false;',
          '<span class="c">// cars may go only on green</span>',
          '<span class="k">if</span> (<span class="n">light</span> == <span class="s">\'G\'</span>)',
          '{',
          '    <span class="n">canGo</span> = true;',
          '}'
        ],
        questions: [
          {
            text: "What is stored in light?",
            options: [
              { label: "The word red", correct: false },
              { label: "The character R", correct: true },
              { label: "true", correct: false }
            ],
            explain: "char holds one letter at a time."
          },
          {
            text: "With light = 'R', what is canGo?",
            options: [
              { label: "true", correct: false },
              { label: "false", correct: true },
              { label: "\'R\'", correct: false }
            ],
            explain: "'R' is not 'G', so cars must wait."
          },
          {
            text: "If light changes to 'G', what happens?",
            options: [
              { label: "canGo becomes true", correct: true },
              { label: "light becomes a bool", correct: false },
              { label: "Nothing — char cannot change", correct: false }
            ],
            explain: "Change the char, and the if can decide differently."
          }
        ]
      },
      {
        title: "Night light",
        scenario: "An Arduino night light turns on only if it is dark and someone is nearby.",
        code: [
          '<span class="t">int</span>     <span class="n">light</span> = 80;',
          '<span class="t">int</span>     <span class="n">distance</span> = 40;',
          '<span class="t">bool</span>    <span class="n">lampOn</span> = false;',
          '<span class="c">// dark = light under 100, nearby = under 50cm</span>',
          '<span class="k">if</span> (<span class="n">light</span> &lt; 100 <span class="k">and</span> <span class="n">distance</span> &lt; 50)',
          '{',
          '    <span class="n">lampOn</span> = true;',
          '}'
        ],
        questions: [
          {
            text: "What must be true for the lamp to turn on?",
            options: [
              { label: "Only dark", correct: false },
              { label: "Dark AND nearby", correct: true },
              { label: "Dark OR nearby", correct: false }
            ],
            explain: "and means both checks must pass."
          },
          {
            text: "With these values, is lampOn true?",
            options: [
              { label: "Yes — both checks pass", correct: true },
              { label: "No — it is not dark enough", correct: false },
              { label: "No — they are too far", correct: false }
            ],
            explain: "80 &lt; 100 and 40 &lt; 50, so lampOn becomes true."
          },
          {
            text: "If distance becomes 120, what is lampOn?",
            options: [
              { label: "true", correct: false },
              { label: "false", correct: true },
              { label: "120", correct: false }
            ],
            explain: "Nearby fails, so the whole and condition fails."
          }
        ]
      }
    ];

    let ei = 0;
    let qi = 0;
    let locked = false;
    const memory = new Map();

    const tabs = document.getElementById("tabs");
    const scenario = document.getElementById("scenario");
    const code = document.getElementById("code");
    const question = document.getElementById("question");
    const options = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    function key() { return `${ei}:${qi}`; }

    function renderTabs() {
      tabs.innerHTML = "";
      examples.forEach((ex, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = ex.title;
        if (i === ei) b.classList.add("active");
        b.onclick = () => {
          ei = i;
          qi = 0;
          render();
        };
        tabs.appendChild(b);
      });
    }

    function render() {
      const ex = examples[ei];
      if (qi >= ex.questions.length) {
        if (ei < examples.length - 1) {
          ei += 1;
          qi = 0;
        } else {
          qi = ex.questions.length - 1;
        }
      }

      renderTabs();
      scenario.textContent = ex.scenario;
      code.innerHTML = ex.code.join("\n");

      const q = ex.questions[qi];
      const saved = memory.get(key());
      locked = saved !== undefined;

      question.textContent = q.text;
      feedback.textContent = "";
      feedback.className = "feedback";
      options.innerHTML = "";

      q.options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "option";
        b.textContent = opt.label;

        if (locked) {
          b.disabled = true;
          if (opt.correct) b.classList.add("correct");
          if (saved.choice === i && !opt.correct) b.classList.add("wrong");
        } else {
          b.onclick = () => choose(i);
        }
        options.appendChild(b);
      });

      if (locked) {
        feedback.textContent = q.explain;
        feedback.classList.add(saved.ok ? "ok" : "bad");
        next.disabled = false;
      } else {
        next.disabled = true;
      }

      prev.disabled = ei === 0 && qi === 0;
      next.textContent = (qi === ex.questions.length - 1 && ei === examples.length - 1) ? "Done" : "Next";
    }

    function choose(i) {
      if (locked) return;
      const q = examples[ei].questions[qi];
      const ok = q.options[i].correct;
      locked = true;
      memory.set(key(), { choice: i, ok });

      [...options.children].forEach((b, idx) => {
        b.disabled = true;
        if (q.options[idx].correct) b.classList.add("correct");
        if (idx === i && !q.options[idx].correct) b.classList.add("wrong");
      });

      feedback.textContent = q.explain;
      feedback.classList.add(ok ? "ok" : "bad");
      next.disabled = false;
    }

    next.onclick = () => {
      if (!locked) return;
      const ex = examples[ei];
      if (qi < ex.questions.length - 1) {
        qi += 1;
      } else if (ei < examples.length - 1) {
        ei += 1;
        qi = 0;
      }
      render();
    };

    prev.onclick = () => {
      if (qi > 0) qi -= 1;
      else if (ei > 0) {
        ei -= 1;
        qi = examples[ei].questions.length - 1;
      }
      render();
    };

    render();
  </script>
</body>
</html>
